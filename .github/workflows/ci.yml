name: CI

# Deterministic, untrusted checks only: lint, typecheck, unit, property, integration, build.
# Kane CLI browser verification needs an authenticated TestMu AI account and a real Chrome,
# so it runs on a trusted machine and is never exposed to pull requests from forks.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: niarva
          # Ephemeral container reachable only from this job; no password is involved.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U niarva"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit and property tests
        run: pnpm test:unit

      - name: Integration tests (embedded PostgreSQL)
        run: pnpm test:integration

      - name: Integration tests (PostgreSQL 16 service)
        run: pnpm test:integration
        env:
          TEST_DATABASE_URL: postgres://niarva@localhost:5432/postgres

      - name: Build
        run: pnpm build

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # gitleaks-action lists the commits of the pull request to scan them.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
